<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1D3A">
  <title>Piyasa Paneli</title>
  <meta name="description" content="ABD, Borsa İstanbul, döviz, altın ve kripto tek ekranda. Canlı fiyatlar, grafikler ve sade Türkçe analiz.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Piyasa Paneli · Tüm piyasalar tek ekranda">
  <meta property="og:description" content="ABD, Borsa İstanbul, döviz, altın ve kripto. Canlı fiyatlar, grafikler ve sade Türkçe analiz.">
  <meta property="og:url" content="https://mtahagayret.github.io/piyasa-paneli/">
  <meta property="og:image" content="https://mtahagayret.github.io/piyasa-paneli/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mtahagayret.github.io/piyasa-paneli/img/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><svg id="bgNet"></svg></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-mark" src="img/icon.svg" alt="" width="34" height="34">
      <div>
        <div class="brand-name">Piyasa Paneli</div>
        <div class="brand-sub">Kişisel finans terminali</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#ozet" data-view="ozet"><span class="ic">◧</span>Günlük Özet</a>
      <a href="#izleme" data-view="izleme"><span class="ic">◉</span>İzleme Listeleri<span class="nbadge" id="alarmBadge" title="Aktif alarm" style="display:none">0</span></a>
      <a href="#haberler" data-view="haberler"><span class="ic">≡</span>Haberler</a>
      <a href="#portfoy" data-view="portfoy"><span class="ic">₺</span>Portföyüm</a>
      <a href="#takvim" data-view="takvim"><span class="ic">▦</span>Ekonomik Takvim</a>
      <a href="#notlar" data-view="notlar"><span class="ic">✎</span>Notlarım</a>
      <a href="#ayarlar" data-view="ayarlar" class="nav-bottom"><span class="ic">⚙</span>Ayarlar</a>
    </nav>
    <div class="side-foot">
      <div class="conn"><span class="dot" id="dotBinance"></span>Kripto · döviz · altın</div>
      <div class="conn"><span class="dot" id="dotFinnhub"></span>ABD hisseleri</div>
      <div class="upd" id="updLabel">Günlük veri: —</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menüyü aç">☰</button>
      <h1 id="viewTitle">Günlük Özet</h1>
      <div class="search">
        <input id="searchIn" type="search" placeholder="Ara: apple, aselsan, bitcoin…" autocomplete="off" aria-label="Varlık ara">
        <div class="search-res" id="searchRes" hidden></div>
      </div>
      <div class="clock" id="clock"></div>
    </header>
    <section class="view" id="view"></section>
  </main>

  <div class="tour" id="tour" hidden></div>
  <div class="tip-bubble" id="tipBubble" hidden></div>
  <div class="toast" id="toast"></div>
  <script src="lib/lightweight-charts.js"></script>
  <script src="ta.js"></script>
  <script src="app.js"></script>
</body>
</html>
